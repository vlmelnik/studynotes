# Publishes an installer that was built elsewhere: push a branch
# "upload/<version>" containing upload/RELEASE (the version, e.g. v1.5.0) and
# the files split into parts < 100 MB (upload/<file>.part-aa, -ab, …).
# upload/REPLACE: an existing release with that tag is deleted first (re-publish).
# The parts are joined, published as a GitHub Release, and the upload branch
# is deleted again afterwards.
name: Publish prebuilt release

on:
  push:
    branches: ['upload/**']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Join the parts
        run: |
          set -e
          mkdir out
          for f in $(ls upload/*.part-* | sed 's/\.part-.*//' | sort -u); do
            cat "$f".part-* > "out/$(basename "$f")"
          done
          if [ -f upload/SHA256SUMS ]; then (cd out && sha256sum -c ../upload/SHA256SUMS); fi
          ls -la out
          echo "TAG=$(tr -d ' \r\n' < upload/RELEASE)" >> "$GITHUB_ENV"
          # optional: upload/NAME (title), upload/NOTES.md (text), upload/NOT_LATEST (e.g. add-on data)
          if [ -f upload/NAME ]; then echo "NAME=$(head -n1 upload/NAME)" >> "$GITHUB_ENV"; else echo "NAME=StudyNotes $(tr -d ' \r\n' < upload/RELEASE)" >> "$GITHUB_ENV"; fi
          if [ -f upload/NOTES.md ]; then echo "BODY=upload/NOTES.md" >> "$GITHUB_ENV"; else echo "BODY=docs/release-notes.md" >> "$GITHUB_ENV"; fi
          if [ -f upload/NOT_LATEST ]; then echo "LATEST=false" >> "$GITHUB_ENV"; else echo "LATEST=true" >> "$GITHUB_ENV"; fi
      - name: Replace an existing release (upload/REPLACE)
        if: hashFiles('upload/REPLACE') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$TAG" --cleanup-tag -y || true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: main
          name: ${{ env.NAME }}
          body_path: ${{ env.BODY }}
          make_latest: ${{ env.LATEST }}
          overwrite_files: true  # re-publishing a version replaces its files
          files: out/*
      - name: Remove the upload branch
        run: git push origin --delete "${GITHUB_REF_NAME}"
